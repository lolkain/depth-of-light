<style>
:root{
  color-scheme: dark;
  --abyss:#040b12; --glass:rgba(5,16,24,.64); --glass-2:rgba(8,24,34,.78);
  --line:rgba(150,205,214,.16); --line-2:rgba(150,205,214,.32);
  --ink:#e3eeee; --muted:#8ea7ae; --faint:#5d7680;
  --sonar:#7fd8cf; --sand:#dcc8a0;
  --band-r:#e0735c; --band-g:#72cf8f; --band-b:#5ba3f2;
  --sans:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --gut:16px;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--abyss);color:var(--ink);font:13px/1.45 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;background:var(--abyss)}
#view:active{cursor:grabbing}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px) saturate(1.1);-webkit-backdrop-filter:blur(10px) saturate(1.1);border-radius:6px}
.lbl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- depth gauge (top-left) */
.hud{position:fixed;left:var(--gut);top:calc(var(--gut) + env(safe-area-inset-top,0px));width:268px;padding:12px 14px;display:grid;gap:10px;z-index:3;transition:opacity .6s}
.title{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.title h1{margin:0;font-size:13px;font-weight:600;letter-spacing:.02em}
.title span{font-size:11px;color:var(--faint)}
.gauge{display:flex;align-items:baseline;gap:8px;border-top:1px solid var(--line);padding-top:10px}
#depth{font:500 42px/1 var(--mono);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
#depth-unit{color:var(--muted);font-size:12px}
#zone{margin-left:auto;font-size:11.5px;color:var(--sonar);text-align:right}
.spec{display:grid;gap:6px}
.spec-head{display:flex;justify-content:space-between;gap:8px}
.bar{display:grid;grid-template-columns:86px 1fr 58px;align-items:center;gap:8px;font-size:11.5px}
.bar .nm{color:var(--muted)}
.bar .tr{height:6px;border-radius:3px;background:rgba(255,255,255,.06);position:relative;overflow:hidden}
.bar .tr i{position:absolute;inset:0 auto 0 0;width:var(--w,100%);border-radius:3px;transition:width .25s}
#br i{background:var(--band-r)} #bg i{background:var(--band-g)} #bb i{background:var(--band-b)}
.bar .v{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.spec-note{font-size:10.5px;color:var(--faint);margin:0}
.bud-note{font-size:11px;line-height:1.4;color:var(--muted);margin:2px 0 0}
.facts{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:11.5px;margin:0}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line);margin:0 -2px}
.tabs button{font:500 11.5px var(--sans);color:var(--muted);background:transparent;border:0;border-bottom:2px solid transparent;padding:6px 4px 5px;cursor:pointer;margin-bottom:-1px}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--sonar)}
.tabs button:focus-visible{outline:2px solid var(--sonar);outline-offset:-2px;border-radius:3px}
.pane{display:grid;gap:10px;align-content:start;min-height:var(--pane-h,0px)}
.swatches,.budget{display:grid;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.sw-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sw-row figure{margin:0;display:grid;gap:4px;justify-items:center}
.sw-row i{display:block;width:100%;height:26px;border-radius:4px;border:1px solid var(--line-2);background:#d9d9d9;transition:background-color .3s}
.sw-row figcaption{font-size:10.5px;color:var(--muted)}
.stack{display:flex;height:10px;border-radius:3px;overflow:hidden;background:rgba(255,255,255,.06)}
.stack i{display:block;height:100%;width:0;transition:width .3s}
.stack i+i{box-shadow:inset 1px 0 0 rgba(4,11,18,.55)}
.legend{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;font-size:11px}
.legend li{display:flex;align-items:center;gap:6px;color:var(--muted)}
.legend li::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c);flex:none}
.legend b{margin-left:auto;font:500 11px var(--mono);color:var(--ink);font-variant-numeric:tabular-nums}
.c-w{--c:#5ba3f2} .c-p{--c:#72cf8f} .c-d{--c:#c7914f} .c-s{--c:#dcc8a0}
.stack i{background:var(--c)}
.facts dt{color:var(--muted)} .facts dd{margin:0;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- controls (top-right) */
.topr{position:fixed;right:var(--gut);top:calc(var(--gut) + env(safe-area-inset-top,0px));z-index:4;display:flex;gap:6px;align-items:stretch}
#fps{display:flex;align-items:center;gap:6px;padding:0 10px;font:500 11.5px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
#fps i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
#fps[data-lv=good] i{background:#72cf8f} #fps[data-lv=ok] i{background:#e3c060} #fps[data-lv=low] i{background:#e0735c}
#fps small{font-size:10px;color:var(--faint)}
#panel-toggle,#lang-btn{display:block;font:500 12px var(--sans);color:var(--ink);padding:8px 12px;cursor:pointer}
#lang-btn{color:var(--muted)}
#lang-btn:hover{color:var(--ink)}
#controls{position:fixed;right:var(--gut);top:calc(var(--gut) + 44px + env(safe-area-inset-top,0px));width:244px;padding:12px 14px;display:grid;gap:8px;z-index:3;
  max-height:min(60vh, calc(100vh - var(--gut) * 3 - 44px - var(--dock-h, 170px)));max-height:min(60dvh, calc(100dvh - var(--gut) * 3 - 44px - var(--dock-h, 170px)));
  overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
#controls::-webkit-scrollbar{width:6px} #controls::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:3px}
#controls[data-open=false]{display:none}
.ctl{display:grid;gap:5px}
.ctl-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ctl-h label{font-size:12px}
.ctl-h output{font:500 11.5px var(--mono);color:var(--sonar);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:var(--line-2);border-radius:2px}
input[type=range]::-moz-range-track{height:3px;background:var(--line-2);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--ink);margin-top:-5px;border:0;box-shadow:0 0 0 3px rgba(127,216,207,.18)}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--ink);border:0}
input[type=range]:focus-visible{outline:none}
input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px var(--sonar)}
select{font:12px var(--sans);color:var(--ink);background:var(--glass-2);border:1px solid var(--line-2);border-radius:4px;padding:4px 6px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.btn{font:500 12px var(--sans);color:var(--abyss);background:var(--sonar);border:0;border-radius:4px;padding:7px 12px;cursor:pointer}
.btn[aria-pressed=true]{background:var(--ink)}
.btn:focus-visible,.st:focus-visible,select:focus-visible,#panel-toggle:focus-visible,#lang-btn:focus-visible{outline:2px solid var(--sonar);outline-offset:2px}
.ctl-note{font-size:10.5px;color:var(--faint);line-height:1.4}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line-2);border-radius:4px;overflow:hidden}
.seg button{font:500 11.5px var(--sans);color:var(--muted);background:transparent;border:0;padding:5px 6px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line-2)}
.seg3{grid-template-columns:1fr 1fr 1fr}
.seg3 button{padding:5px 2px;font-size:11px}
.seg button[aria-pressed=true]{background:rgba(127,216,207,.16);color:var(--ink)}
.seg button:focus-visible{outline:2px solid var(--sonar);outline-offset:-2px}
input[type=range]:disabled{opacity:.35;cursor:not-allowed}

/* ---------- transect (bottom) */
.dock{position:fixed;left:var(--gut);right:var(--gut);bottom:calc(var(--gut) + env(safe-area-inset-bottom,0px));z-index:3;display:grid;gap:8px}
.st-wrap{display:flex;align-items:stretch;gap:6px;min-width:0}
#stations{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;scroll-behavior:smooth;cursor:grab;touch-action:pan-x}
#stations.dragging{cursor:grabbing;scroll-behavior:auto}
#stations.dragging .st{pointer-events:none}
.st-wrap[data-l=true] #stations{-webkit-mask-image:linear-gradient(to right,transparent 0,#000 28px);mask-image:linear-gradient(to right,transparent 0,#000 28px)}
.st-wrap[data-r=true] #stations{-webkit-mask-image:linear-gradient(to left,transparent 0,#000 28px);mask-image:linear-gradient(to left,transparent 0,#000 28px)}
.st-wrap[data-l=true][data-r=true] #stations{-webkit-mask-image:linear-gradient(to right,transparent 0,#000 28px,#000 calc(100% - 28px),transparent 100%);mask-image:linear-gradient(to right,transparent 0,#000 28px,#000 calc(100% - 28px),transparent 100%)}
.st-arrow{flex:0 0 30px;display:none;align-items:center;justify-content:center;border-radius:4px;border:1px solid var(--line);background:var(--glass);color:var(--ink);cursor:pointer;font:14px var(--sans);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.st-wrap[data-ovf=true] .st-arrow{display:flex}
.st-arrow:disabled{opacity:.3;cursor:default}
.st-arrow:focus-visible{outline:2px solid var(--sonar);outline-offset:2px}
#stations::-webkit-scrollbar{display:none}
.st{flex:0 0 auto;display:grid;gap:1px;text-align:left;padding:6px 10px;border-radius:4px;border:1px solid var(--line);background:var(--glass);color:var(--ink);cursor:pointer;font-family:var(--sans);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.st-n{font-size:12px;font-weight:500}
.st-s{font-size:10.5px;color:var(--muted)}
.st[aria-current=true]{border-color:var(--sonar);box-shadow:inset 0 -2px 0 var(--sonar)}
.st:hover{border-color:var(--line-2)}
.tbox{padding:8px 10px 6px;display:grid;gap:4px}
.tbox-h{display:flex;justify-content:space-between;gap:10px;font-size:10.5px;color:var(--muted)}
#transect{width:100%;height:104px;display:block;cursor:crosshair;border-radius:3px}
#transect .ground{fill:#1b1712;stroke:var(--sand);stroke-width:1;stroke-opacity:.55}
#transect .sl{stroke:#cfe7ea;stroke-opacity:.5;stroke-width:1}
#transect .zl{stroke:#cfe7ea;stroke-opacity:.22;stroke-dasharray:3 4}
#transect .zt,#transect .dt{fill:#b6cbd0;font:10px var(--mono)}
#transect .tm{cursor:pointer}
#transect .tm-hit{fill:transparent}
#transect .tm-dot{fill:#e3eeee;fill-opacity:.75}
#transect .tm:hover .tm-dot{fill:var(--sonar);fill-opacity:1}
#transect .cam-dot{fill:var(--sonar);stroke:#041016;stroke-width:1.5}
#transect .cam-ray{stroke:var(--sonar);stroke-width:1.5}
.hint{font-size:10.5px;color:var(--faint)}


#fallback{position:fixed;inset:0;display:grid;place-items:center;padding:0 var(--gut);z-index:9;background:var(--abyss)}
#fallback div{max-width:420px;text-align:center;color:var(--muted)}
body:not(.ready) .hud, body:not(.ready) #controls, body:not(.ready) .dock{opacity:0}
.hud,#controls,.dock{transition:opacity .8s ease}

@media (max-width: 860px){
  .hud{width:auto;right:calc(var(--gut) + 262px);padding:10px 12px;gap:8px}
  .spec-note,.title span{display:none}
  #depth{font-size:32px}
  .hint{display:none}
  #transect{height:84px}
}
@media (max-width: 480px){
  .hud{right:var(--gut);top:calc(var(--gut) + 44px + env(safe-area-inset-top,0px))}
  .tabs,.pane{display:none}
  .gauge{border-top:0;padding-top:0}
  .title{display:none}
}
@media (max-height: 760px){
  .spec-note{display:none}
}
@media (prefers-reduced-motion: reduce){ .hud,#controls,.dock,.bar .tr i{transition:none} }
</style>

// inverse: world position of a point given in (cross-shore X, alongshore z)
vec2 shoreXinv(vec2 q){
  float S = uWarp.x * shoreS(q.y), x = q.x + S;
  x = q.x + S * (1.0 - smoothstep(300.0, 1300.0, x));
  return vec2(x, q.y);
}
vec2 shoreJ(vec2 p){   // (\u2202X/\u2202x, \u2202X/\u2202z)
  float t = clamp((p.x - 300.0) / 1000.0, 0.0, 1.0);
  float w = 1.0 - t * t * (3.0 - 2.0 * t), dw = (p.x > 300.0 && p.x < 1300.0) ? -6.0 * t * (1.0 - t) / 1000.0 : 0.0;
  return vec2(1.0 - uWarp.x * shoreS(p.y) * dw, -uWarp.x * shoreSd(p.y) * w);
}
// rip channels cut through the bars every ~360 m: waves break less there and the bed is deeper
float ripF(vec2 p, float X){
  float r = smoothstep(0.86, 0.97, 0.5 + 0.5 * sin(p.y / 57.0 + 0.7 * sin(p.y / 173.0)));
  return uWarp.y * r * smoothstep(55.0, 80.0, X) * (1.0 - smoothstep(150.0, 185.0, X));
}
// how hard waves are breaking here (0\u20131): dissipation intensity, plus a little spilling wherever waves are saturated
float breakI(vec2 p){ float X = shoreX(p); vec4 r = dataRow(X, 0); return max(smoothstep(0.08, 0.6, r.w), 0.2 * smoothstep(0.95, 1.05, r.z)) * (1.0 - 0.85 * ripF(p, X)); }

// ---------------------------------------------------------------- terrain
vec4 nzS(vec2 uv, float lod, bool cub){ return cub ? texCubic(uNoise, uv) : textureLod(uNoise, uv, lod); }
float zoneF(float x, vec4 v){ return smoothstep(v.x, v.y, x) * (1.0 - smoothstep(v.z, v.w, x)); }
vec4 terrainInfoX(vec2 p, float lod, bool cub){
  float x = shoreX(p);
  float P = prof(x);
  float dP = max(-P, 0.0);
  vec4 n1 = nzS(R1 * p / 512.0, lod, cub);
  vec4 n2 = nzS(R2 * p / 96.0 + 0.37, lod, cub);
  vec4 n3 = nzS(R3 * p / 20.0 + 0.71, lod, cub);
  float h = P;
  // bedform relief grows offshore but never exceeds a fraction of the water depth: on a flat, barely-submerged shelf
  // (tidal flats) it must not poke out as dry shoals far beyond the waterline
  float sandA = (0.25 + 0.55 * smoothstep(0.0, 300.0, x)) * mix(1.0, 0.25 + 0.75 * smoothstep(0.3, 2.0, dP), smoothstep(-20.0, 5.0, x));
  float wallIn = smoothstep(uWallZ.x, uWallZ.y, x);
  // the foreshore is planed smooth by the swash: metre-scale lumps there would make the waterline (the level set of the
  // relief on a gentle slope) wander in jagged, perspective-stretched teeth
  float fine = mix(0.15, 1.0, smoothstep(0.6, 2.0, abs(P - 0.2)));
  h += ((n2.r - 0.5) * 1.5 * sandA + (n3.r - 0.5) * 0.22 * fine) * (1.0 - wallIn) * uTerr.z;
  float land = smoothstep(-30.0, -120.0, x);
  h += land * ((n1.g - 0.3) * 7.0 + (n2.g - 0.5) * 2.5) * uTerr.y;
  float cov = uReefCov.x * smoothstep(uReefCov.y, uReefCov.y + 40.0, x) * (1.0 - smoothstep(uReefCov.z - 40.0, uReefCov.z, x));   // dense fore-reef
  float rockM = smoothstep(0.5 - cov, 0.64 - cov, n1.r * 0.6 + n2.g * 0.4) * zoneF(x, uReefZ);
  // reef/rock heads never grow above the water they live in (lagoon patch reefs stay submerged)
  h += rockM * min((1.2 + 3.4 * smoothstep(0.3, 0.75, n2.r) + (n3.r - 0.5) * 1.1 + (n3.g - 0.5) * 0.5) * uTerr.x, 0.6 * max(dP, 0.4) + 0.3);
  float wall = zoneF(x, uWallZ);
  h += wall * ((n2.r - 0.5) * 12.0 + (n2.b - 0.5) * 4.0 + (n3.r - 0.5) * 2.4 + (n3.b - 0.5) * 2.0);
  // sedimentary ledges on the wall
  float tq = h / 7.0;
  float ter = (floor(tq) + smoothstep(0.15, 0.85, fract(tq))) * 7.0;
  h = mix(h, ter, wall * 0.55 * smoothstep(0.35, 0.75, n1.g));
  h += smoothstep(1500.0, 2000.0, x) * (n1.r - 0.5) * 14.0 * min(1.0, dP / 300.0);
  // tidal creeks meandering across the mud flat (level sets of two noise layers)
  float cz = uTerr.w * smoothstep(uCreekZ.x, uCreekZ.x + 60.0, x) * (1.0 - smoothstep(uCreekZ.y - 200.0, uCreekZ.y, x));
  // main channels follow a level set of the 512 m layer (\u224810 m wide, gently rounded banks), shallow rills the 96 m layer
  float ch = (1.0 - smoothstep(0.0, uCreekZ.w, abs(n1.r - 0.5))) + 0.15 * (1.0 - smoothstep(0.0, uCreekZ.w * 0.7, abs(n2.r - 0.5)));
  h -= cz * min(ch, 1.1) * uCreekZ.z;
  h -= 0.9 * ripF(p, x);
  float grass = smoothstep(0.52, 0.62, n1.a * 0.7 + n2.a * 0.3) * zoneF(x, uGrassZ) * (1.0 - rockM);
  return vec4(h, max(rockM, wall * smoothstep(0.3, 0.55, n2.b)), grass, wall);
}
vec4 terrainInfo(vec2 p, float lod){ return terrainInfoX(p, lod, false); }
float terrainH(vec2 p, float lod){ return terrainInfo(p, lod).x; }

// ---------------------------------------------------------------- sea surface
// swell height + gradient + shore swash.
// Waveform per component follows the local nonlinearity:
//   deep water  : 2nd-order Stokes (slightly peaked crests)
//   shallow     : cnoidal-like \u2014 narrow crests on long flat troughs, set by the Ursell number U = H\xB7L\xB2/d\xB3
//   surf zone   : bores \u2014 once waves are saturated (breaking) the front face steepens into a step
float gSwFp = 0.0, gSwVar = 0.0;   // pixel footprint for swell slope filtering; slope variance filtered away
float gBore = 0.0;                 // how much of a breaking bore front is at this point (for foam)
// e^-q \xB7 I0(q): mean of exp(q(cos\u03C6\u22121)) over a period (Abramowitz\u2013Stegun fits)
float i0e(float q){
  if (q < 3.75){ float t = q / 3.75; t *= t;
    return exp(-q) * (1.0 + t * (3.5156229 + t * (3.0899424 + t * (1.2067492 + t * (0.2659732 + t * (0.0360768 + t * 0.0045813)))))); }
  float t = 3.75 / q;
  return (0.39894228 + t * (0.01328592 + t * (0.00225319 + t * (-0.00157565 + t * (0.00916281 + t * (-0.02057706 + t * (0.02635537 + t * (-0.01647633 + t * 0.00392377)))))))) / sqrt(q);
}
float swell(vec2 p, out vec2 grad, out float crest){
  float h = 0.0; grad = vec2(0.0); crest = 0.0; gBore = 0.0;
  float X = shoreX(p);
  vec2 J = shoreJ(p);
  vec4 r0 = dataRow(X, 0);
  float br = r0.z * (1.0 - 0.2 * ripF(p, X));
  float d = max(-r0.x, 0.06);
  float lean = smoothstep(0.55, 1.15, br) * 1.4;     // shoaling waves pitch forward before they break
  float skew = 0.82 * smoothstep(0.88, 1.0, br);      // saturated (breaking) waves: sawtooth bores
  vec4 PH0, KX0;
  for (int j = 0; j < 2; j++){
    vec4 PH, A, KX;
    if (X <= DX1){ PH = dataRow(X, 1 + 3 * j); A = dataRow(X, 2 + 3 * j); KX = dataRow(X, 3 + 3 * j); }
    else {
      ivec2 e = ivec2(int(DN) - 1, 0);
      KX = texelFetch(uData, e + ivec2(0, 3 + 3 * j), 0);
      PH = texelFetch(uData, e + ivec2(0, 1 + 3 * j), 0) + KX * (X - DX1);
      A = texelFetch(uData, e + ivec2(0, 2 + 3 * j), 0);
    }
    if (j == 0){ PH0 = PH; KX0 = KX; }
    // short-crestedness: each swell train's height wanders along the crest (\u2248100\u2013200 m), so refracted crests
    // arriving parallel to the shore do not form ruler-straight lines
    vec4 cm = 0.55 + 0.9 * textureLod(uNoise, R2 * p / (j == 0 ? 190.0 : 110.0) + (j == 0 ? 0.31 : 0.67), 0.0);
    for (int i = 0; i < 4; i++){
      vec4 sw = uSw[j * 4 + i];
      float th = -PH[i] + sw.x * p.y - sw.y * uTime + sw.z;
      float k = length(vec2(KX[i], sw.x));
      float a = A[i] * cm[i];
      if (a < 1e-4) continue;
      float s = sin(th), c = cos(th);
      // deep-water shape
      float st = min(0.5 * k * a, 0.35);
      float s2 = sin(2.0 * th), c2 = cos(2.0 * th);
      float fS = s - st * c2 + lean * st * s2;
      float dS = c + 2.0 * st * s2 + 2.0 * lean * st * c2;
      // shallow-water shape: \u03C6 measured from the crest, skewed so the shoreward face is the steep one
      float Ur = 2.0 * a * 39.48 / (k * k * d * d * d);   // H\xB7L\xB2/d\xB3
      // tiny waves (a few cm) never form knife-edged fronts: friction and surface tension round them off
      float af = smoothstep(0.03, 0.25, a);
      float sk = skew * af;
      float q = (3.6 * smoothstep(12.0, 160.0, Ur) + 2.2 * sk) * (0.35 + 0.65 * af);
      float wS = smoothstep(0.0, 0.6, q);
      float f = fS, df = dS;
      if (wS > 0.0){
        float ph = th - 1.5708;
        float phw = ph - sk * cos(ph);
        float dphw = 1.0 + sk * sin(ph);
        float qq = max(q, 0.05);
        float e = exp(qq * (cos(phw) - 1.0));
        float nrm = 2.0 / (1.0 - exp(-2.0 * qq));
        float fC = (e - i0e(qq)) * nrm;
        float dC = -qq * sin(phw) * e * nrm * dphw;
        f = mix(fS, fC, wS); df = mix(dS, dC, wS);
        // bore front: the steep, collapsing face just shoreward of a breaking crest
        float dMax = qq * nrm * (1.0 + sk) * 0.607 / sqrt(qq + 0.5);   // \u2248 steepest point of this waveform
        gBore = max(gBore, sk * wS * smoothstep(0.45, 0.85, -dC / dMax) * smoothstep(0.04, 0.3, a));   // a 10 cm bore on a flat makes a thin line, not a white field
      }
      // crests narrower than a few pixels would alias into moir\xE9 stripes: fade them (height and slope) toward the mean
      // and hand the lost slope to the glint roughness
      float kf = gSwFp * k * 0.159;
      float keepS = 1.0 - smoothstep(0.12, 0.4, kf);
      h += a * f * (1.0 - smoothstep(0.06, 0.25, kf));
      grad += a * df * vec2(-KX[i] * J.x, sw.x - KX[i] * J.y) * keepS;
      gSwVar += (1.0 - keepS * keepS) * 0.5 * (a * k) * (a * k);
      crest += a * k * f;
    }
  }
  vec4 PH = PH0, KX = KX0;
  // swash: bores run up the beach face; set by the two largest swells so run-up varies set to set
  float th0 = -PH[0] + uSw[0].x * p.y - uSw[0].y * uTime + uSw[0].z;
  float th1 = -PH[1] + uSw[1].x * p.y - uSw[1].y * uTime + uSw[1].z;
  float win = smoothstep(-26.0, -4.0, X) * (1.0 - smoothstep(6.0, 34.0, X));
  float b0 = 0.5 + 0.5 * sin(th0 + 0.4), b1 = 0.5 + 0.5 * sin(th1 + 1.1);
  float grp = 0.55 + 0.45 * (0.5 + 0.5 * sin(th0 - th1));      // wave groups: every few waves a bigger set
  float sw = (b0 * b0 * b0 * 0.75 + b1 * b1 * b1 * 0.35) * grp;
  float keepW = 1.0 - smoothstep(0.12, 0.4, gSwFp * length(vec2(KX[0], uSw[0].x)) * 0.159);
  sw = mix(0.3, sw, keepW);                                        // unresolved run-up: a steady mean wet band
  win *= mix(0.6, 1.0, keepW);
  h += uSwash * sw * win;
  grad += J * uSwash * win * keepW * grp * (0.75 * 3.0 * b0 * b0 * 0.5 * cos(th0 + 0.4) * -KX[0] + 0.35 * 3.0 * b1 * b1 * 0.5 * cos(th1 + 1.1) * -KX[1]);
  return h;
}
const float L0 = 200.0, L1 = 40.0, L2 = 8.0;
float lodC(float fp, float L){ return clamp(log2(max(fp * 256.0 / L, 1.0)), 0.0, 8.0); }
// ---- breaking the tile repetition of the 200 m and 40 m cascades.
// Each is sampled twice \u2014 as is, and rotated/offset \u2014 and the two copies are blended with a slowly wandering weight.
// The copies are independent realisations of the same Gaussian sea, so a variance-preserving blend
// (weights normalised by 1/\u221A(w\xB2+(1\u2212w)\xB2)) keeps wave heights and slope statistics unchanged while the lattice disappears.
const mat2 RT0 = mat2(0.956, 0.292, -0.292, 0.956), RT1 = mat2(0.921, -0.391, 0.391, 0.921);
const vec2 OF0 = vec2(71.3, 133.7), OF1 = vec2(17.9, 5.3);
vec2 tileW(vec2 x, int c){
  float n = textureLod(uNoise, R3 * x / (c == 0 ? 640.0 : 170.0) + (c == 0 ? 0.23 : 0.61), 0.0).b;
  float w = smoothstep(0.3, 0.7, n);
  return vec2(w, inversesqrt(w * w + (1.0 - w) * (1.0 - w)));
}
vec4 casA(int c, vec2 x, float lod){           // (Dx, h, Dz, J)
  float L = c == 0 ? L0 : L1;
  mat2 Rt = c == 0 ? RT0 : RT1;
  vec2 W = tileW(x, c);
  vec4 a = c == 0 ? textureLod(uC0A, x / L, lod) : textureLod(uC1A, x / L, lod);
  if (W.x < 0.001) return a;
  vec2 xb = (Rt * x + (c == 0 ? OF0 : OF1)) / L;
  vec4 b = c == 0 ? textureLod(uC0A, xb, lod) : textureLod(uC1A, xb, lod);
  b.xz = b.xz * Rt;                           // displacement back into the world frame
  vec4 r = (a * (1.0 - W.x) + b * W.x) * W.y;
  r.w = mix(a.w, b.w, W.x);
  return r;
}
vec4 casB(int c, vec2 x, float lod){           // (sx, sz, sx\xB2, sz\xB2)
  float L = c == 0 ? L0 : L1;
  mat2 Rt = c == 0 ? RT0 : RT1;
  vec2 W = tileW(x, c);
  vec4 a = c == 0 ? textureLod(uC0B, x / L, lod) : textureLod(uC1B, x / L, lod);
  if (W.x < 0.001) return a;
  vec2 xb = (Rt * x + (c == 0 ? OF0 : OF1)) / L;
  vec4 b = c == 0 ? textureLod(uC0B, xb, lod) : textureLod(uC1B, xb, lod);
  b.xy = b.xy * Rt;
  float u = 1.0 - W.x;
  return vec4((a.xy * u + b.xy * W.x) * W.y, (a.zw * u * u + b.zw * W.x * W.x) * W.y * W.y);
}
// wind-sea weight per FFT cascade (200 m / 40 m / 8 m tiles): long components need depth, but short, steep
// chop survives over very shallow flats (depth-limited height, not switched off); slow gust patches offshore
vec3 windW(vec2 p){
  float d = -prof(shoreX(p));
  float g = uChop * (0.75 + 0.5 * textureLod(uNoise, p / 900.0 + 0.13, 0.0).g);
  // depth limit: the long wind-sea components cannot be taller than the water is deep (a 2 m reef lagoon never
  // carries the open-ocean sea state; waves that tall have already broken on the crest)
  float lim0 = clamp(0.32 * d / max(uHsW, 0.05), 0.0, 1.0), lim1 = clamp(0.8 * d / max(uHsW, 0.05), 0.0, 1.0);
  return g * vec3(smoothstep(0.1, 0.5 + 1.1 * uHsW, d) * lim0, smoothstep(0.05, 0.5, d) * lim1, smoothstep(0.015, 0.12, d));
}
// rough local wave height (swell + wind sea) for foam and "awash" decisions
float waveActivity(vec2 p){
  float X = shoreX(p);
  vec4 A = dataRow(X, 2), B = dataRow(X, 5);
  return 1.6 * sqrt(dot(A, A) + dot(B, B)) + 0.5 * uHsW * windW(p).x;
}
float windScale(vec2 p){ return windW(p).y; }
// Choppy (horizontally displaced) waves: find the undisplaced point x0 whose displaced position lands on p
vec2 fftInvert(vec2 p, float fp, vec3 w){
  vec2 x0 = p;
  float l0 = lodC(fp, L0), l1 = lodC(fp, L1);
  for (int i = 0; i < 2; i++){
    vec2 D = casA(0, x0, l0).xz * w.x + casA(1, x0, l1).xz * w.y;
    x0 = p - D;
  }
  return x0;
}
float fftHeight(vec2 x0, float fp, vec3 w){
  float h = casA(0, x0, lodC(fp, L0)).y * w.x + casA(1, x0, lodC(fp, L1)).y * w.y;
  if (fp < 0.4) h += textureLod(uC2A, x0 / L2, lodC(fp, L2)).y * w.z;
  return h;
}
float waveHA(vec2 p, float fp){   // analytic: swell + FFT wind sea (used to bake the clipmaps and at the lens)
  float Xi = shoreX(p);
  if (Xi < uInland - 4.0) return -6.0;   // no inland water bodies behind the beach (tidal-flat creeks do hold water)
  vec2 g; float c;
  gSwFp = fp;
  float h = swell(p, g, c);
  gSwFp = 0.0;
  vec3 w = windW(p);
  if (w.z > 0.001){ vec2 x0 = fftInvert(p, fp, w); h += fftHeight(x0, fp, w); }
  // behind the swash zone the water table sinks away under the sand instead of ending in a vertical cut
  return h - 1.6 * smoothstep(uInland + 8.0, uInland - 4.0, Xi);
}

// ---------------------------------------------------------------- baked height clipmaps
// Ray marching evaluates heights dozens of times per pixel. Terrain (static per coast) and the sea surface (once per
// frame) are baked into nested camera-centred grids; marching reads one texel instead of re-evaluating noise, swell
// and FFT. Final terrain hits near the camera, normals and materials still use the analytic functions.
uniform sampler2D uTAtlas;   // terrain: R = height \u2212 profile, G = conservative max over the texel; 3 levels side by side
uniform sampler2D uSAtlas;   // sea surface height; 4 levels side by side
uniform vec4 uTLv[3];        // level origin.xy, size (m), 1/texels
uniform vec4 uSLv[4];
float atlasAt(sampler2D tex, vec4 lv, float L, float nL, vec2 p, int ch){
  vec2 uv = clamp((p - lv.xy) / lv.z, vec2(0.5 * lv.w), vec2(1.0 - 0.5 * lv.w));
  vec4 v = textureLod(tex, vec2((L + uv.x) / nL, uv.y), 0.0);
  return ch == 0 ? v.r : v.g;
}
float lvW(vec4 lv, vec2 p){ vec2 d = abs((p - lv.xy) / lv.z - 0.5); return 1.0 - smoothstep(0.40, 0.47, max(d.x, d.y)); }
float terrainRes(vec2 p, float fp, int ch){
  float w0 = lvW(uTLv[0], p) * (1.0 - smoothstep(0.7, 1.6, fp));
  if (w0 > 0.999) return atlasAt(uTAtlas, uTLv[0], 0.0, 3.0, p, ch);
  float w1 = lvW(uTLv[1], p) * (1.0 - smoothstep(6.0, 16.0, fp));
  float r = atlasAt(uTAtlas, uTLv[2], 2.0, 3.0, p, ch) * lvW(uTLv[2], p);   // beyond the last level: bare profile
  if (w1 > 0.001) r = mix(r, atlasAt(uTAtlas, uTLv[1], 1.0, 3.0, p, ch), w1);
  if (w0 > 0.001) r = mix(r, atlasAt(uTAtlas, uTLv[0], 0.0, 3.0, p, ch), w0);
  return r;
}
float terrainHB(vec2 p, float fp){ return prof(shoreX(p)) + terrainRes(p, fp, 0); }
float terrainHBmax(vec2 p, float fp){ return prof(shoreX(p)) + terrainRes(p, fp, 1); }
float waveH(vec2 p, float fp){
  if (shoreX(p) < uInland - 4.0) return -6.0;
  float w0 = lvW(uSLv[0], p) * (1.0 - smoothstep(0.35, 0.8, fp));
  if (w0 > 0.999) return atlasAt(uSAtlas, uSLv[0], 0.0, 4.0, p, 0);
  float w1 = lvW(uSLv[1], p) * (1.0 - smoothstep(1.4, 3.2, fp));
  float w2 = lvW(uSLv[2], p) * (1.0 - smoothstep(5.5, 13.0, fp));
  float h = atlasAt(uSAtlas, uSLv[3], 3.0, 4.0, p, 0) * lvW(uSLv[3], p);   // beyond the last level: mean sea level
  if (w2 > 0.001) h = mix(h, atlasAt(uSAtlas, uSLv[2], 2.0, 4.0, p, 0), w2);
  if (w1 > 0.001) h = mix(h, atlasAt(uSAtlas, uSLv[1], 1.0, 4.0, p, 0), w1);
  if (w0 > 0.001) h = mix(h, atlasAt(uSAtlas, uSLv[0], 0.0, 4.0, p, 0), w0);
  return h;
}

// ---------------------------------------------------------------- optics
struct Medium { vec3 a; vec3 b; vec3 st; vec3 kd; vec3 ce; float pf; };
const vec3 AW = vec3(0.265, 0.050, 0.0105);
float clarityField(float x){
  float c = uClar0;
  for (int i = 0; i < 4; i++) c = mix(c, uClarV[i], smoothstep(uClarS[i], uClarE[i], x));
  return c;
}
// alongshore plumes / patches of turbid water (1 = mean)
float plume(vec2 p){
  float n = textureLod(uNoise, vec2(p.x / 260.0, p.y / 140.0) + 0.47, 0.0).r * 0.7 + textureLod(uNoise, p / 55.0 + 0.19, 0.0).g * 0.3;
  return mix(1.0, 0.25 + 1.5 * smoothstep(0.3, 0.72, n), uSed.w);
}
// bio-optical model: chlorophyll-like load C from the Jerlov-style clarity index (mirrors waterIOP() in world.js)
void iopCore(float c, out vec3 a, out vec3 bp){
  float C = exp(mix(log(0.04), log(4.0), c));
  a = AW + vec3(0.010, 0.009, 0.032) * pow(C, 0.65) + vec3(0.106, 0.326, 0.756) * 0.02 * pow(C, 0.8);
  bp = vec3(0.887, 1.02, 1.19) * 0.30 * pow(C, 0.62);
}
Medium medium(vec2 p, float z){
  Medium m;
  float x = shoreX(p);
  bool regional = uWaterMode > 0.5;
  vec3 a0, bp0;
  iopCore(regional ? clarityField(x) : uClarity, a0, bp0);
  float pz = regional ? mix(0.22, 1.0, exp(-max(z, 0.0) / 140.0)) : 1.0;           // particles thin out below the mixed layer
  vec3 bp = bp0 * pz;
  m.a = AW + (a0 - AW) * mix(0.6, 1.0, pz);
  if (regional){

  pat = mix(0.5, pat, resolved); ridge = mix(0.5, ridge, resolved);
  float fe = 0.05 + fpA * 1.2;
  float c1 = sat(cov);
  float blob = smoothstep(1.0 - c1 * 0.62 - fe, 1.0 - c1 * 0.62 + fe, pat);
  float web = smoothstep(0.7 - fe, 0.82 + fe, ridge) * smoothstep(0.05, 0.4, c1) * 0.8;
  float f = max(max(blob, web), smoothstep(0.5, 1.2, fresh) * (0.75 + 0.25 * smoothstep(0.3, 0.6, pat)));
  // the rolling face of a bore: turbulent, torn white water rather than a smooth ribbon
  f = max(f, bore * smoothstep(0.3, 0.62, pat * 0.6 + ridge * 0.25 + bore * 0.3));
  // far away: no fine lace (it would shimmer), but keep the coarse structure \u2014 foam patches tens of metres across
  float nLow = textureLod(uNoise, vec2(x0.x / 14.0, x0.y / 60.0) + 0.61, log2(max(fpA * 256.0 / 14.0, 1.0))).r;   // streaks along the shore
  f = mix(f, (c1 * 0.8 + sat(fresh) * 0.4 + bore * 0.1) * (0.35 + 1.0 * smoothstep(0.3, 0.7, nLow)), 1.0 - resolved);
  s.foam = sat(f) * smoothstep(0.0, 0.02, wd);
  s.crest = crest;
  return s;
}

// ---------------------------------------------------------------- volume
vec3 waterVolume(vec3 ro, vec3 rd, float d, Medium m, out vec3 T){
  float z0 = max(0.0, -ro.y);
  float mu = dot(rd, uSunDirW);
  float ph = phaseW(mu, m.pf);
  vec3 qs = m.st - m.ce * uInvCosW * rd.y;
  vec3 Is = m.b * ph * uBeam0 * exp(-m.ce * uInvCosW * z0) * segInt(qs, d);
  vec3 qd = m.st - m.kd * rd.y;
  // diffuse light field is not isotropic: it is strongly peaked toward the zenith (asymptotic radiance distribution)
  float u = 0.5 + 0.5 * rd.y;
  float ang = (0.12 + 2.2 * u * u * u) / 0.67;
  vec3 Ia = 2.6 * m.b * (1.0 / (4.0 * PI)) * ang * uAmb0 * exp(-m.kd * z0) * segInt(qd, d);
  T = exp(-m.st * min(d, 1e4));
  return Is + Ia;
}
// light-shaft modulation (caustic focusing projected through the water column)
vec3 shafts(vec3 ro, vec3 rd, float d, Medium m, int N){
  float L = min(d, 70.0);
  float j = ign(gl_FragCoord.xy);
  float ph = phaseW(dot(rd, uSunDirW), m.pf);
  vec3 acc = vec3(0.0);
  for (int i = 0; i < 32; i++){
    if (i >= N) break;
    float u = (float(i) + j) / float(N);
    float s = L * u * u;
    float ds = L * 2.0 * u / float(N);
    vec3 p = ro + rd * s;
    float z = max(-p.y, 0.0);
    float c = causticAt(p, z, 0.0, 3.2, m.b.g - BW.g) - 1.0;
    float con = smoothstep(0.0, 2.5, z) * exp(-z / 45.0);
    acc += beamAt(z, m) * c * con * exp(-m.st * s) * ds;
  }
  return acc * m.b * ph * 1.6;
}
// ROV lamp backscatter
vec3 lampVolume(vec3 rd, float d, Medium m){
  float sp = smoothstep(0.70, 0.985, dot(rd, uCamFwd));
  sp *= sp;
  if (sp <= 0.0) return vec3(0.0);
  vec3 acc = vec3(0.0);
  float L = min(d, 40.0);
  float j = ign(gl_FragCoord.xy + 17.0);
  float ph = phaseW(-0.95, m.pf);
  for (int i = 0; i < 10; i++){
    float u = (float(i) + j) / 10.0;
    float s = 0.2 + L * u * u; float ds = L * 2.0 * u / 10.0;
    acc += exp(-2.0 * m.st * s) / (s * s + 1.5) * ds;
  }
  return uLampI * sp * m.b * ph * acc * 0.06;
}

// ---------------------------------------------------------------- shading helpers
float softShadow(vec3 p, vec3 l, float k){
  float res = 1.0, t = 0.35;
  for (int i = 0; i < 14; i++){
    vec3 q = p + l * t;
    float d = q.y - terrainHB(q.xz, 0.0) + 0.08;   // bias: mip-filtered heights sit below the shaded surface (avoids contour acne)
    res = min(res, k * d / t);
    t += clamp(d * 0.6, 0.25, 14.0);
    if (res < 0.02 || q.y > 36.0) break;
  }
  return sat(res);
}
vec3 terrainNormal(vec2 p, float t){
  float e = 0.03 + t * 0.0025;
  if (t < 70.0){
    float h0 = terrainInfoX(p, 0.0, true).x;
    float hx = terrainInfoX(p + vec2(e, 0.0), 0.0, true).x;
    float hz = terrainInfoX(p + vec2(0.0, e), 0.0, true).x;
    return normalize(vec3(h0 - hx, e, h0 - hz));
  }
  float lod = clamp(log2(max(t * uPixAng * 16.0, 1.0)), 0.0, 6.0);
  float h0 = terrainH(p, lod);
  float hx = terrainH(p + vec2(e, 0.0), lod);
  float hz = terrainH(p + vec2(0.0, e), lod);
  return normalize(vec3(h0 - hx, e, h0 - hz));
}
float D_GGX(float NoH, float a){ float a2 = a * a; float d = NoH * NoH * (a2 - 1.0) + 1.0; return a2 / (PI * d * d); }

struct Mat { vec3 alb; vec3 n; float wet; float rough; float pud; };
float lodFor(float fp, float scale){ return clamp(log2(max(fp * 256.0 / scale, 1.0)), 0.0, 8.0); }
vec4 nzD(vec2 q, float lod){ return lod < 0.6 ? texCubic(uNoise, q) : textureLod(uNoise, q, lod); }
Mat terrainMat(vec3 p, float t){
  Mat mt;
  bool near = t < 70.0;
  vec4 ti = terrainInfoX(p.xz, 0.0, near);
  vec3 n = terrainNormal(p.xz, t);
  float fp = t * uPixAng;
  // footprint along the view direction: at grazing angles a pixel covers a long strip of ground, so regular
  // ripple trains alias into screen-aligned stripes unless they are faded using this (not the isotropic) size
  float fpG = fp / max(abs(normalize(p - uCamPos).y), 0.1);
  float depth = -p.y;
  float rockW = smoothstep(0.2, 0.6, ti.y);
  // multi-scale detail on independent rotated domains (3.1 m / 0.83 m / 0.21 m)
  vec2 qa = R2 * p.xz / 3.1, qb = R3 * p.xz / 0.83 + 0.19, qc = R1 * p.xz / 0.21 + 0.53;
  vec4 na = nzD(qa, lodFor(fp, 3.1));
  vec4 nb = nzD(qb, lodFor(fp, 0.83));
  vec4 nc = textureLod(uNoise, qc, lodFor(fp, 0.21));
  vec4 nm = textureLod(uNoise, R1 * p.xz / 23.0 + 0.5, max(lodFor(fp, 23.0), 4.0));   // low-pass: only broad variation
  vec4 nw = textureLod(uNoise, qa, max(lodFor(fp, 3.1), 3.5));
  float fb = 1.0 - smoothstep(0.012, 0.06, fp);
  float fc = 1.0 - smoothstep(0.004, 0.02, fp);
  float gm = ti.z * smoothstep(0.3, 0.7, na.a + 0.2);
  float sandZone = (1.0 - rockW) * (1.0 - gm);

  // --- ripple marks: wavelength, orientation and presence all wander; asymmetric (steep lee side)
  float Xm = shoreX(p.xz);
  float mudR = uMud * (1.0 - smoothstep(uMudX * 0.5, uMudX, Xm)) * smoothstep(-uMudTop - 0.6, -uMudTop + 1.0, depth);
  float rip = (1.0 - mudR * 0.8) * (1.0 - smoothstep(0.012, 0.045, fpG)) * smoothstep(0.3, 1.5, depth) * (1.0 - smoothstep(35.0, 70.0, depth))
            * smoothstep(0.15, 0.45, nm.b + 0.15) * sandZone;
  vec2 rdir = vec2(0.985, 0.174);   // fixed axis: a direction/wavelength field multiplied by world position would explode the phase
  float lam = 0.13;
  float ph = dot(p.xz, rdir) * 6.2831 / lam + (nw.g - 0.5) * 7.0 + (nm.g - 0.5) * 40.0 + (nm.r - 0.5) * 25.0;
  float rs = sin(ph) + 0.28 * sin(2.0 * ph);
  float rdv = cos(ph) + 0.56 * cos(2.0 * ph);
  float mega = (1.0 - smoothstep(0.08, 0.3, fpG)) * smoothstep(0.5, 3.0, depth) * (1.0 - smoothstep(20.0, 50.0, depth)) * sandZone;
  float ph2 = dot(p.xz, vec2(0.995, 0.10)) * 6.2831 / 0.95 + nm.b * 14.0 + nw.r * 3.0;
  vec3 bump = vec3(0.0);
  bump.xz += -rdir * rdv * 0.5 * rip;
  bump.x += -0.14 * (cos(ph2) + 0.4 * cos(2.0 * ph2)) * mega;
  // micro relief
  float smoothMud = 1.0 - 0.75 * mudR * (1.0 - rockW);   // soft mud: no grain, only gentle undulation
  bump.xz += (na.gb - 0.5) * 0.22 * (1.0 - smoothstep(0.05, 0.4, fp));
  bump.xz += (nb.rg - 0.5) * (0.22 * smoothMud + 0.55 * rockW) * fb;
  bump.xz += (na.ar - 0.5) * 0.9 * rockW * (1.0 - smoothstep(0.1, 0.6, fp));
  vec4 nr = textureLod(uNoise, RW * p.xz / 1.4 + 0.77, lodFor(fp, 1.4));
  bump.xz += (nr.gb - 0.5) * 0.8 * rockW * (1.0 - smoothstep(0.03, 0.25, fp));
  bump.xz += (nc.ba - 0.5) * (0.25 * smoothMud + 0.3 * rockW) * fc;
  // dry-sand wind ripples on the beach (not on mud flats)
  float wind = (1.0 - smoothstep(0.02, 0.07, fpG)) * smoothstep(-2.0, -10.0, Xm) * smoothstep(0.35, 0.8, p.y) * (1.0 - mudR);
  float phw = dot(p.xz, vec2(0.83, 0.56)) * 6.2831 / 0.11 + nw.a * 8.0 + nm.r * 20.0;
  bump.x += -0.4 * cos(phw) * wind;
  n = normalize(n + bump);

  // --- sand
  vec3 beachSand = uBeachAlb;
  vec3 subSand = uSubAlb;
  vec3 ooze = vec3(0.36, 0.34, 0.30);
  vec3 alb = mix(beachSand, subSand, smoothstep(-1.0, 6.0, depth));
  // fine sediment settles as mud inside the turbid band (smooths ripples, darkens the bed)
  float mud = uMud * (1.0 - smoothstep(uMudX * 0.5, uMudX, Xm)) * smoothstep(-uMudTop - 0.6, -uMudTop + 1.0, depth);
  float mpatch = smoothstep(0.25, 0.55, nm.r * 0.6 + na.r * 0.4 + 0.15);
  mud *= mix(mpatch, 0.8 + 0.2 * mpatch, smoothstep(0.8, 0.95, uMud));   // tidal flats: mud almost everywhere
  alb = mix(alb, ooze, smoothstep(60.0, 300.0, depth));
  // large-area variation mixes an incommensurate 173 m layer in, so the 23 m noise period never shows as a lattice from the air
  vec4 nL = textureLod(uNoise, R2 * p.xz / 173.0 + 0.41, lodFor(fp, 173.0));
  alb *= mix(vec3(0.93, 0.96, 1.0), vec3(1.05, 1.0, 0.92), nm.a * 0.5 + nL.b * 0.5) * (0.86 + 0.28 * na.r);   // grain-size sorting patches
  alb *= 1.0 - 0.30 * rip * (0.5 - 0.5 * rs);                                               // heavy minerals in troughs
  alb *= mix(1.0, 0.82 + 0.36 * nc.r * nb.g, fc);                                          // grain-scale mottling
  alb *= 1.0 + 0.16 * wind * sin(phw);                                                     // lighter wind-ripple crests

  alb = mix(alb, mix(vec3(0.30, 0.27, 0.22), vec3(0.25, 0.235, 0.21), smoothstep(0.8, 0.95, uMud)) * (0.85 + 0.3 * nb.g), mud);
  // --- rock: strata, cracks, encrusting life in the photic zone, sediment dust on ledges
  float strata = sin(p.y * 2.1 + (na.r - 0.5) * 5.0 + nm.g * 4.0);
  vec3 rock = mix(vec3(0.27, 0.25, 0.22), vec3(0.19, 0.18, 0.17), 0.5 + 0.5 * strata) * (0.72 + 0.56 * na.b);
  float crack = smoothstep(0.84, 0.97, nb.b) * (1.0 - smoothstep(0.05, 0.3, fp));
  rock *= 1.0 - 0.28 * crack;
  float up = smoothstep(0.45, 0.85, n.y);
  float photic = 1.0 - smoothstep(12.0, 45.0, depth);
  vec3 turf = vec3(0.15, 0.16, 0.075) * (0.7 + 0.6 * nb.g);
  vec3 coralline = vec3(0.44, 0.26, 0.29) * (0.8 + 0.4 * na.g);
  rock = mix(rock, coralline, photic * smoothstep(0.52, 0.68, nm.a * 0.6 + nb.r * 0.4) * 0.85);
  // living coral cover (tropical reefs): massive/brain corals, branching colonies, soft corals and sponges
  float cph = uCoral * (1.0 - smoothstep(18.0, 45.0, depth));
  vec3 coralCol = mix(vec3(0.62, 0.48, 0.30), vec3(0.50, 0.30, 0.46), smoothstep(0.45, 0.65, nb.r));
  coralCol = mix(coralCol, vec3(0.58, 0.60, 0.34), smoothstep(0.62, 0.75, na.a));
  coralCol = mix(coralCol, vec3(0.70, 0.40, 0.28), smoothstep(0.7, 0.8, nb.g) * 0.8);
  rock = mix(rock, coralCol * (0.75 + 0.5 * nc.g), cph * smoothstep(0.35, 0.55, nm.b * 0.5 + na.g * 0.5) * 0.9);
  rock = mix(rock, turf, photic * up * smoothstep(0.35, 0.6, na.g) * 0.85);
  rock = mix(rock, vec3(0.43, 0.41, 0.37) * (0.85 + 0.3 * nb.g), up * smoothstep(20.0, 120.0, depth) * smoothstep(0.35, 0.6, na.a));
  // rock tops that are awash: living coral cannot survive exposure \u2014 dark algal turf, pale dead-coral rubble, barnacle crust
  float awash = rockW > 0.01 ? smoothstep(-(0.2 + 0.6 * waveActivity(p.xz)), 0.05, p.y) : 0.0;
  vec3 flat_ = mix(vec3(0.15, 0.13, 0.085), vec3(0.27, 0.23, 0.15), smoothstep(0.4, 0.7, nb.g));
  flat_ = mix(flat_, vec3(0.52, 0.49, 0.42), smoothstep(0.62, 0.78, na.b) * 0.8);
  rock = mix(rock, flat_ * (0.75 + 0.5 * nc.r), awash * 0.9);
  alb = mix(alb, rock, rockW);

  // --- seagrass: streaky canopy aligned with the surge
  float streak = textureLod(uNoise, vec2(p.x * 0.35, p.z * 2.4) + 0.13, lodFor(fp, 0.4)).g;
  vec3 grass = mix(vec3(0.04, 0.075, 0.028), vec3(0.10, 0.13, 0.05), smoothstep(0.35, 0.7, streak)) * (0.75 + 0.5 * na.g);
  alb = mix(alb, grass, gm);

  // --- dunes with sparse vegetation
  float mudFlat = smoothstep(0.6, 0.9, uMud);
  float veg = smoothstep(mix(-90.0, -120.0, mudFlat), mix(-150.0, -190.0, mudFlat), Xm) * smoothstep(mix(0.45, 0.56, mudFlat), mix(0.6, 0.64, mudFlat), textureLod(uNoise, R3 * p.xz / 61.0 + 0.17, lodFor(fp, 61.0)).r * 0.45 + nL.g * 0.35 + na.a * 0.2);
  // on the upper tidal flat the pioneer plants are glassworts / seepweed (\uCE60\uBA74\uCD08), which turn red-purple
  vec3 vegCol = mix(vec3(0.30, 0.31, 0.17), mix(vec3(0.34, 0.12, 0.13), vec3(0.24, 0.20, 0.12), nb.r), mudFlat);
  alb = mix(alb, vegCol * (0.7 + 0.5 * nb.g), veg);

  // --- wetness (swash zone band)
  float wetLine = uWetTop + 0.12 * (nm.g - 0.5) + uSwash * 0.8;
  mt.wet = sat(1.0 - smoothstep(wetLine - 0.25, wetLine, p.y)) * step(-0.3, p.y + 0.3);
  mt.alb = alb;
  mt.n = n;
  mt.rough = mix(0.9, 0.18, mt.wet);
  // ebb-tide puddles and water film left in the hollows of an exposed mud flat: flat, mirror-like
  float pud = mudR * step(0.0, p.y) * smoothstep(0.6, 0.63, nm.g * 0.7 + nw.b * 0.3 + 0.06 * (1.0 - smoothstep(0.0, 1.5, p.y)));
  mt.pud = pud;
  mt.n = normalize(mix(mt.n, vec3(0.0, 1.0, 0.0), pud * 0.9));
  mt.rough = mix(mt.rough, 0.035, pud);
  mt.wet = max(mt.wet, pud);
  return mt;
}

vec3 shadeLand(vec3 p, vec3 rd, float t){
  Mat mt = terrainMat(p, t);
  vec3 n = mt.n;
  vec3 alb = mt.alb * mix(1.0, 0.55, mt.wet);
  float NoL = max(dot(n, uSunDir), 0.0);
  float sh = NoL > 0.0 && t < 260.0 ? softShadow(p + n * 0.05, uSunDir, 10.0) : 1.0;
  float ao = sat(0.55 + (terrainHB(p.xz, 0.0) - terrainHB(p.xz, 8.0)) * 0.35);
  vec3 col = alb / PI * (uSunE * NoL * sh + uSkyE * (0.55 + 0.45 * n.y) * ao);
  // wet-sand specular
  vec3 v = -rd; vec3 h = normalize(uSunDir + v);
  float a = mt.rough * mt.rough;
  float F = 0.02 + 0.98 * pow(1.0 - max(dot(v, h), 0.0), 5.0);
  col += uSunE * sh * NoL * D_GGX(max(dot(n, h), 0.0), a) * F / (4.0 * max(dot(n, v), 0.05) * max(NoL, 0.05)) * mt.wet * 0.9;
  vec3 r = reflect(rd, n);
  float Fr = pow(1.0 - max(dot(n, v), 0.0), 5.0);
  col += skyL(r) * mt.wet * mix(0.02 + 0.3 * Fr, 0.02 + 0.98 * Fr, mt.pud);
  col *= 1.0 - 0.2 * mt.pud * (1.0 - Fr);   // a thin film of turbid water darkens what shows through
  return col;
}

vec3 shadeFloorWater(vec3 p, float t, Medium m){
  Mat mt = terrainMat(p, t);
  vec3 n = mt.n;
  float z = max(0.0, -p.y);
  vec3 Eb = beamAt(z, m);
  float NoL = max(dot(n, uSunDirW), 0.0);
  float sh = 1.0;
  if (NoL > 0.0 && t < 160.0 && max(Eb.b, Eb.g) > 1e-3 * uBeam0.b) sh = softShadow(p + n * 0.05, uSunDirW, 4.0);
  float ca = causticAt(p, z, t, 0.0, m.b.g - BW.g);
  float ao = sat(0.55 + (terrainHB(p.xz, 0.0) - terrainHB(p.xz, 8.0)) * 0.3);
  // with depth the refracted beam is progressively scattered into a broad, still downward-peaked light field:
  // shadows and caustics fade, and faces turned away from the sun (a reef wall) are lit from above instead
  float fd = 1.0 - exp(-(m.b.g - BW.g * 0.5) * z * 0.6);
  vec3 Edir = Eb * NoL * sh * ca;
  vec3 Edif = Eb * uSunDirW.y * (0.3 + 0.7 * max(n.y, 0.0)) * mix(0.6, 1.0, ao);
  vec3 E = mix(Edir, Edif, fd) + ambAt(z, m) * 0.55 * (0.5 + 0.5 * n.y) * ao;
  vec3 col = mt.alb * 0.92 / PI * E;
  return col;
}
// floor as seen through the lamp (added separately so it isn't tinted by sun geometry)
vec3 lampOnFloor(vec3 p, vec3 n, vec3 alb, float t, Medium m){
  vec3 l = uCamPos - p; float r = length(l); l /= r;
  float sp = smoothstep(0.70, 0.985, dot(-l, uCamFwd)); sp *= sp;
  return alb / PI * uLampI * sp * max(dot(n, l), 0.0) / (r * r + 0.3) * exp(-m.st * r);
}

// ---------------------------------------------------------------- surface as seen from above
vec3 shadeSurfaceAbove(vec3 p, vec3 rd, float t, out float wetMask, out float film, out float wd){
  Surf s = surfaceAt(p.xz, t, t * uPixAng / sqrt(max(abs(rd.y), 0.02)));
  vec3 n = s.n;
  vec3 v = -rd;
  if (dot(n, v) < 0.02) n = normalize(n + v * (0.02 - dot(n, v)));
  float NoV = max(dot(n, v), 0.02);
  float F = fresnel(NoV, 1.0 / NW);
  vec3 r = reflect(rd, n); r.y = abs(r.y);
  vec4 cl = clouds(r, 1.0);
  vec3 Lr = skyL(r) * (1.0 - cl.a) + cl.rgb;
  // sun glint (GGX); roughness grows with distance to account for unresolved slopes
  float alpha = sqrt(0.0025 + 0.004 * uSea + s.var);
  vec3 h = normalize(uSunDir + v);
  float Fs = fresnel(max(dot(v, h), 0.0), 1.0 / NW);
  vec3 Lsun = uSunE * Fs * D_GGX(max(dot(n, h), 0.0), alpha) / (4.0 * NoV) * step(0.0, uSunDir.y) * (1.0 - clouds(uSunDir, 2.0).a * 0.9);
  // refraction into the water body
  vec3 rt = refract(rd, n, 1.0 / NW);
  Medium m = medium(p.xz, -p.y);
  float tmaxW = min(7.0 / min3(m.st), 350.0);
  vec3 T, Lw;
  float tf = traceTerrain(p, rt, 0.01, tmaxW, 0.45, int(mix(48.0, 110.0, uQuality)));
  // multiply-scattered upwelling (semi-analytic Gordon/Lee reflectance): dominant in turbid, sediment-laden water,
  // where single scattering alone would leave the sea looking black from above
  // particle backscatter ratio: ~0.028 for mixed coastal particles, rising toward ~0.04 in mineral-dominated turbid water
  vec3 bbk = 0.5 * BW + mix(0.028, 0.042, smoothstep(0.6, 3.5, m.b.g - BW.g)) * (m.b - BW);
  vec3 uu = bbk / (m.a + bbk);
  vec3 rrs = 0.0949 * uu + 0.0794 * uu * uu;
  vec3 Ed0 = uBeam0 * uSunDirW.y + uAmb0 * 0.75;
  float Hv = (tf > 0.0 ? tf : 1e4) * max(-rt.y, 0.05);
  vec3 Lms = Ed0 * rrs * (1.0 - exp(-2.5 * m.kd * Hv));
  if (tf > 0.0){
    vec3 hp = p + rt * tf;
    vec3 Lf = shadeFloorWater(hp, t + tf, m);
    vec3 Li = waterVolume(p, rt, tf, m, T);
    Lw = Lf * T + max(Li, Lms);
  } else {
    Lw = max(waterVolume(p, rt, 1e5, m, T), Lms);
  }
  // subsurface glow through thin wave crests when looking toward the sun
  float glow = sat(s.crest * 2.0) * pow(sat(dot(rd, uSunDir) * 0.5 + 0.5), 3.0) * smoothstep(3.0, 20.0, -prof(shoreX(p.xz)));
  Lw += glow * m.b * uBeam0 * vec3(0.3, 0.9, 1.0) * 0.25;
  vec3 col = Lw * (1.0 - F) / (NW * NW) + F * Lr + Lsun;
  // foam
  vec3 foamL = vec3(0.85, 0.88, 0.9) * uFoamTint / PI * (uSunE * max(uSunDir.y, 0.0) * 0.85 + uSkyE);
  col = mix(col, foamL, s.foam * 0.92);
  wetMask = s.foam;
